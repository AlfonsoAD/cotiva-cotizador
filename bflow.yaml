# bflow.yaml — generado por bflow init. Solo lo propio de este repo; lo compartido va en el perfil.
tracker:
  adapter: github
vcs:
  host: github
  base_branch: auto-repair-shop
agent: [claude]
check:
  steps:
    # Revision estatica sin Excel: Option Explicit, codificacion Windows-1252 y,
    # en lo que agrega la rama, sin Debug.Print/Stop/Select/Activate. Compilar y
    # probar en Excel sigue siendo manual (build.ps1).
    - name: lint
      run: powershell -NoProfile -ExecutionPolicy Bypass -File build/lint.ps1 -Base {base}
    # Compila y prueba el VBA en Excel (oculto). Requiere Excel de escritorio y tarda
    # 1-2 minutos; sin Excel falla, no se salta.
    - name: test
      run: powershell -NoProfile -ExecutionPolicy Bypass -File build/test.ps1
